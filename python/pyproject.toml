[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "magic-formula"
dynamic = ["version"]
description = "Pacejka Magic Formula tire models (PAC2002, MF 5.2, MF 6.1) from the magic-formula C++ library, with NumPy batch evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "matplotlib>=3.8"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=4.0"
cmake.source-dir = ".."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
build.targets = ["mf_python"]
wheel.packages = ["src/magic_formula"]

[tool.scikit-build.cmake.define]
MF_BUILD_PYTHON = "ON"
MF_BUILD_TESTS = "OFF"
# Relative: CMake resolves it against the source dir (the repo root). Run the Release conan install first.
CMAKE_TOOLCHAIN_FILE = "build/conan/release/conan_toolchain.cmake"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../CMakeLists.txt"
regex = 'project\(magic_formula VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--cov=magic_formula", "--cov-branch",
           "--cov-report=term-missing", "--cov-fail-under=100"]
