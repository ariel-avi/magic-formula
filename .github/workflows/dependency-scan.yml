name: Dependency scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC: newly published CVEs surface without a push
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scanner:
    name: OSV-Scanner (npm, PyPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install "uv>=0.11,<1"
      # The closure is resolved universally from the requires-python floor on purpose: resolving only
      # for 3.12 would hide the exposure of the older supported Python versions. The script fails on an
      # empty result, which neutralises the OSV action's mapping of exit code 128 (no packages) to 0.
      - name: Resolve the Python dependency closure (every supported Python version)
        run: |
          bash .github/scripts/resolve-python-deps.sh build/osv/python-requirements.txt
          echo "::group::build/osv/python-requirements.txt"
          cat build/osv/python-requirements.txt
          echo "::endgroup::"
      # Explicit --lockfile paths turn a missing or renamed lockfile into exit 127 (the job fails).
      # No config file and no ignore entry: nothing is silenced.
      - name: Scan (fails on any known vulnerability)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=web/package-lock.json
            --lockfile=requirements.txt:build/osv/python-requirements.txt
