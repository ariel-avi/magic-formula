name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install "cmake>=4.0,<5" "conan>=2,<3" ninja
          cmake --version
      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 clang-tidy-19 clang-format-19
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-clang-19-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-clang-19-
      - name: Conan install (Debug)
        run: |
          conan profile detect --force
          conan install . --build=missing -s build_type=Debug -s compiler.cppstd=26
      - name: Configure
        run: cmake --preset debug -DCLANG_FORMAT_EXE=clang-format-19 "-DCLANG_TIDY_EXE=clang-tidy-19;--warnings-as-errors=*"
      - name: Registration check (every C++ file is listed in a CMakeLists.txt)
        shell: bash
        run: |
          diff <(git ls-files --cached --others --exclude-standard -- '*.hpp' '*.cpp' | LC_ALL=C sort -u) \
               <(ninja -C build/debug -t commands clang-format_all | tr ' ' '\n' | grep -E '\.(hpp|cpp)$' | sed "s|^$(pwd)/||" | LC_ALL=C sort -u)
      - name: clang-format gate
        run: |
          cmake --build --preset debug --target clang-format_all
          git diff --exit-code
      - name: clang-tidy gate
        run: cmake --build --preset debug --target clang-tidy_all

  build-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            cppstd: '26'
          - name: linux-clang-19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            cppstd: '26'
          # Conan's msvc settings know cppstd up to 23 (mapped to /std:c++latest); CMakeLists.txt falls back to 23 too.
          - name: windows-msvc
            os: windows-2025
            cc: cl
            cxx: cl
            cppstd: '23'
          # Homebrew LLVM, not AppleClang: Apple's libc++ lacks floating-point from_chars and views::join_with.
          - name: macos-llvm-21
            os: macos-15
            cc: /opt/homebrew/opt/llvm@21/bin/clang
            cxx: /opt/homebrew/opt/llvm@21/bin/clang++
            cppstd: '26'
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install "cmake>=4.0,<5" "conan>=2,<3" ninja
          cmake --version
      - name: Install Clang 19
        if: matrix.name == 'linux-clang-19'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install LLVM 21 (Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.name }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ matrix.os }}-${{ matrix.name }}-
      - name: Conan profile
        run: conan profile detect --force
      - name: Conan install (Debug)
        if: runner.os != 'macOS'
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=${{ matrix.cppstd }}
      # Homebrew's libc++ is keg-only: link against it (not the older system libc++) and find it at run time.
      # Homebrew builds libc++ with vendor availability annotations ON, so libc++ 21 marks std::from_chars(double)
      # unavailable for the macOS deployment target even though we link Homebrew's newer libc++.dylib
      # ("'from_chars' is unavailable"). _LIBCPP_DISABLE_AVAILABILITY turns those annotations off.
      - name: Conan install (Debug, Homebrew libc++)
        if: runner.os == 'macOS'
        run: |
          LINKFLAGS="['-L/opt/homebrew/opt/llvm@21/lib/c++','-L/opt/homebrew/opt/llvm@21/lib/unwind','-lunwind','-Wl,-rpath,/opt/homebrew/opt/llvm@21/lib/c++']"
          conan install . --build=missing -s build_type=Debug -s compiler.cppstd=${{ matrix.cppstd }} \
            -c "tools.build:exelinkflags=${LINKFLAGS}" -c "tools.build:sharedlinkflags=${LINKFLAGS}" \
            -c "tools.build:defines=['_LIBCPP_DISABLE_AVAILABILITY']"
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test (all)
        run: ctest --preset debug
      # Separate steps: PowerShell (Windows) only reports the exit code of the last command of a step.
      - name: Test (unit)
        run: ctest --preset debug -L unit --no-tests=error
      - name: Test (module)
        run: ctest --preset debug -L module --no-tests=error
      # Compile-only check that bench/ still builds (Release + Google Benchmark); never run as a gate.
      - name: Build benchmarks (compile only)
        if: matrix.name == 'linux-gcc-14'
        run: |
          conan install . --build=missing -s build_type=Release -s compiler.cppstd=${{ matrix.cppstd }}
          cmake --preset release
          cmake --build --preset release --target mf_bench

  coverage:
    name: Coverage (gcc-14, 100% line and branch)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install "cmake>=4.0,<5" "conan>=2,<3" "gcovr>=8,<9" ninja
          cmake --version
          gcovr --version
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-14-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-gcc-14-
      - name: Conan install (Debug)
        run: |
          conan profile detect --force
          conan install . --build=missing -s build_type=Debug -s compiler.cppstd=26
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Coverage gate
        run: cmake --build --preset coverage --target coverage
      - name: Print uncovered lines
        if: always()
        run: cat coverage/summary.txt || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  python:
    name: Python bindings (gcc-14, pytest + notebook)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install "cmake>=4.0,<5" "conan>=2,<3" ninja
          cmake --version
      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-gcc-14-release-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-gcc-14-release-
      - name: Conan install (Release)
        run: |
          conan profile detect --force
          conan install . --build=missing -s build_type=Release -s compiler.cppstd=26 -o with_benchmark=False
      - name: Build and install the package
        run: python -m pip install "./python[test]"
      - name: pytest (100% coverage gate, notebook)
        run: python -m pytest python/tests
