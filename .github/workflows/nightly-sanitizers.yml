# Nightly dynamic analysis of the solver only (mflib, mf and every CTest unit and module test):
# AddressSanitizer + LeakSanitizer, UndefinedBehaviorSanitizer, ThreadSanitizer and Valgrind memcheck.
# Scheduled runs analyse only when relevant files changed since the head_sha of the last successful run;
# the first run (no baseline) and manual runs always run all four. The one list of relevant paths lives in
# .github/scripts/nightly-changes.sh.
name: Nightly sanitizers

on:
  schedule:
    - cron: '23 3 * * *'        # daily 03:23 UTC (off the hour)
  workflow_dispatch:            # manual run: bypasses the changed-files check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash                 # bash -eo pipefail: `cmd | tee log` fails when cmd fails

jobs:
  changes:
    name: Relevant changes since the last successful run
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with: { fetch-depth: 0 }
      # A failed baseline query must neither pick "run all" nor "skip": the step is continue-on-error so that
      # Decide (if: always()) still writes the decision record, then fails the job (analysis is not started).
      - name: Last successful run (baseline)
        id: baseline
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          workflow_file="${GITHUB_WORKFLOW_REF%%@*}"; workflow_file="${workflow_file##*/}"
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_file" --branch "$GITHUB_REF_NAME" \
                  --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        if: always()
        env:
          BASELINE_SHA: '${{ steps.baseline.outputs.sha }}'
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          mkdir -p build/nightly
          if [ "$CHECKOUT_OUTCOME" != "success" ] || [ "$BASELINE_OUTCOME" = "failure" ]; then
            {
              echo "## Nightly sanitizers: changed-files decision"
              echo
              echo "| Item | Value |"
              echo "|------|-------|"
              echo "| Event | \`$GITHUB_EVENT_NAME\` |"
              echo "| Decision | none (job fails) |"
              echo "| Reason | baseline query failed (checkout: $CHECKOUT_OUTCOME, baseline: $BASELINE_OUTCOME) |"
              echo "| Head | \`$GITHUB_SHA\` |"
            } | tee build/nightly/decision.md >> "$GITHUB_STEP_SUMMARY"
            echo "::error::baseline query failed: no run/skip decision was made"
            exit 1
          fi
          bash .github/scripts/nightly-changes.sh "$GITHUB_EVENT_NAME" "$BASELINE_SHA" | tee build/nightly/decision.md
          cat build/nightly/decision.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the decision record
        if: always()
        uses: actions/upload-artifact@v6
        with: { name: nightly-decision, path: build/nightly/decision.md, if-no-files-found: error }

  analysis:
    name: ${{ matrix.title }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300      # budget, not a measurement: about 203 s natively for 1449 tests was measured on arm64 macOS, and the full valgrind ctest -j4 took about 55 min in an arm64 ubuntu:24.04 container (colima), not on the x86_64 runner; runner timings not yet measured
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: asan,     title: 'AddressSanitizer + LeakSanitizer' }
          - { preset: ubsan,    title: 'UndefinedBehaviorSanitizer' }
          - { preset: tsan,     title: 'ThreadSanitizer' }
          - { preset: valgrind, title: 'Valgrind memcheck' }
    env:
      CC: clang-19
      CXX: clang++-19
      PRESET: ${{ matrix.preset }}
      LOG_DIR: build/nightly/${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install build tools
        run: python -m pip install "cmake>=4.0,<5" "conan>=2,<3" ninja
      - name: Install LLVM 19 (clang, sanitizer runtimes, llvm-symbolizer), libstdc++ 14 and jq
        # clang-19 uses the libstdc++ of the highest GCC installation it finds; std::ranges::to needs
        # libstdc++ 14 (ubuntu:24.04 defaults to 13). libstdc++-14-dev pulls in libgcc-14-dev, which
        # provides the GCC 14 installation directory that clang selects over GCC 13.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev llvm-19 libstdc++-14-dev jq
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
      - name: Install Valgrind
        if: matrix.preset == 'valgrind'
        run: sudo apt-get install -y --no-install-recommends valgrind && valgrind --version
      - name: Lower ASLR entropy for the sanitizer runtimes
        if: matrix.preset != 'valgrind'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2/p
          key: conan-ubuntu-24.04-linux-clang-19-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-ubuntu-24.04-linux-clang-19-
      - name: Conan install (Debug)
        run: |
          mkdir -p "$LOG_DIR"
          conan profile detect --force
          conan install . --build=missing -s build_type=Debug -s compiler.cppstd=26 2>&1 | tee "$LOG_DIR/conan.log"
      - name: Configure
        run: cmake --preset "$PRESET" 2>&1 | tee "$LOG_DIR/configure.log"
      - name: Build
        id: build
        run: cmake --build --preset "$PRESET" 2>&1 | tee "$LOG_DIR/build.log"
      - name: Remove stale reports
        run: bash .github/scripts/nightly-findings.sh --clean "$PRESET"
      - name: Test (every unit and module test)
        run: |
          ctest --preset "$PRESET" --output-junit "$GITHUB_WORKSPACE/$LOG_DIR/ctest-junit.xml" \
                --test-output-size-passed 10485760 --test-output-size-failed 10485760 2>&1 | tee "$LOG_DIR/ctest.log"
      - name: Findings gate (active check + reports)
        if: always() && steps.build.outcome == 'success'
        run: bash .github/scripts/nightly-findings.sh "$PRESET" 2>&1 | tee "$LOG_DIR/findings.log"
      - name: Upload the full results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.preset }}
          path: |
            build/nightly/${{ matrix.preset }}/
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/sanitizer.*
            build/${{ matrix.preset }}/valgrind.*.log
          if-no-files-found: error
